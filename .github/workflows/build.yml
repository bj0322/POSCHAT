name: Build installer

# PR과 수동 실행: Windows에서 설치 파일을 빌드하고 앱 자가 진단까지 확인한 뒤 결과물(artifact)로 올린다.
# v로 시작하는 태그(예: v1.2.0)를 push하면 같은 빌드를 GitHub Release에 첨부한다.
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # setup-python은 python.org 빌드(tcl/tk 포함)를 쓰므로 build_installer.py 요구 사항을 만족한다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: python build_installer.py

      - name: Self-test the built app
        shell: pwsh
        run: |
          $app = Join-Path $env:TEMP "PostechChat-build\app\PostechChat\PostechChat.exe"
          Start-Process -FilePath $app -ArgumentList "--selftest" -Wait
          $report = Join-Path $env:APPDATA "PostechChat\selftest.txt"
          Get-Content $report
          $text = Get-Content $report -Raw
          foreach ($want in "web: True", "documents: OK", "word OK", "powerpoint OK", "excel OK") {
            if (-not $text.Contains($want)) { Write-Error "selftest에 '$want'이(가) 없습니다."; exit 1 }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PostechChat-Setup
          path: release/PostechChat-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/PostechChat-Setup.exe --title "${{ github.ref_name }}" --generate-notes
