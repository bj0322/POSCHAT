name: Build installer

# PR과 수동 실행: Windows 설치 파일과 Android APK를 빌드하고, 각각 자가 진단(Windows)과
# 에뮬레이터 계측 테스트(Android)까지 확인한 뒤 결과물(artifact)로 올린다.
# v로 시작하는 태그(예: v1.2.0)를 push하거나, 수동 실행 때 release에 태그 이름을 넣으면
# 두 결과물을 그 태그의 GitHub Release에 첨부한다(수동 실행은 실행한 커밋에 태그를 만든다).
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release로 올릴 태그 이름(예: v1.2.0). 비우면 빌드만 합니다."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # setup-python은 python.org 빌드(tcl/tk 포함)를 쓰므로 build_installer.py 요구 사항을 만족한다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        # 러너 콘솔은 cp1252라서 빌드 스크립트의 한글 출력에서 UnicodeEncodeError가 난다.
        # 자가 진단은 사용자 PC와 같은 조건이어야 하므로 이 단계에만 UTF-8을 켠다.
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python build_installer.py

      - name: Self-test the built app
        shell: pwsh
        run: |
          $app = Join-Path $env:TEMP "PostechChat-build\app\PostechChat\PostechChat.exe"
          Start-Process -FilePath $app -ArgumentList "--selftest" -Wait
          $report = Join-Path $env:APPDATA "PostechChat\selftest.txt"
          Get-Content $report
          $text = Get-Content $report -Raw
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          foreach ($want in "version: $version", "web: True", "documents: OK", "word OK", "powerpoint OK", "excel OK", "paper OK", "notion OK", "hyperframes OK", "firecrawl OK") {
            if (-not $text.Contains($want)) { Write-Error "selftest에 '$want'이(가) 없습니다."; exit 1 }
          }

      - name: Install silently and check the registered version
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "PostechChat-install"
          Start-Process -FilePath "release\PostechChat-Setup.exe" -ArgumentList "--silent", "--dir=$dir", "--no-desktop" -Wait
          Get-Content (Join-Path $env:TEMP "PostechChat-install.log")
          if (-not (Test-Path (Join-Path $dir "PostechChat.exe"))) { Write-Error "설치 폴더에 PostechChat.exe가 없습니다."; exit 1 }
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          $registered = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PostechChat").DisplayVersion
          Write-Output "version.py: $version / 설치 프로그램 등록 버전: $registered"
          if ($registered -ne $version) { Write-Error "설치 프로그램 버전($registered)이 앱 버전($version)과 다릅니다."; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: PostechChat-Setup
          path: release/PostechChat-Setup.exe

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy는 앱에 넣는 것과 같은 버전의 Python(3.11)으로 빌드한다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Free disk space for the emulator
        # Android 14 에뮬레이터는 데이터 영역에 7GB 넘게 필요하다. 이 작업에서 쓰지 않는 큰 도구를 지운다.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 14 이미지: 기본 WebView가 앱 화면의 최신 JavaScript를 지원한다(Android 11 이미지의 WebView는 너무 오래됐다).
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # 실패하면 앱·화면·Python 로그를 남긴다
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest || { adb logcat -d -s Poschat:V PoschatWeb:V python.stdout:V python.stderr:V AndroidRuntime:E TestRunner:V chromium:W | tail -400; exit 1; }

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PostechChat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PostechChat-Android
          path: PostechChat.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports/androidTests/

  publish:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: >
          gh release create "$TAG" dist/PostechChat-Setup.exe dist/PostechChat.apk
          --repo "$GITHUB_REPOSITORY" --title "POSTECH GenAI Chat $TAG" --target "$GITHUB_SHA" --generate-notes
