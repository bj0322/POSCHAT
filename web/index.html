<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POSCHAT</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-top">
      <div class="brand"><div class="logo">P</div><span>POSCHAT</span></div>
      <button class="icon-btn" id="btn-collapse" title="사이드바 닫기" data-icon="sidebar"></button>
    </div>
    <button class="new-chat" id="btn-new"><span data-icon="edit"></span>새 채팅</button>
    <button class="new-chat po-entry" id="btn-po" title="강의를 녹음해 받아 적고, 강의 자료와 함께 필기 노트를 만듭니다">
      <span data-icon="mic"></span>PO노트<span class="rec-dot" id="po-rec-dot" hidden></span>
    </button>
    <button class="new-chat po-entry" id="btn-browser" aria-pressed="false" title="채팅 옆에 웹페이지를 열고, 보고 있는 페이지를 AI에게 묻습니다">
      <span data-icon="globe"></span>브라우저
    </button>
    <button class="new-chat po-entry" id="btn-research" title="논문 라이브러리·BibTeX·작업 폴더 문서 검색">
      <span data-icon="book"></span>연구 라이브러리
    </button>
    <button class="new-chat po-entry" id="btn-auto" title="에이전트의 Python·Jupyter 실행과 원격 서버(SSH) 실행">
      <span data-icon="terminal"></span>에이전트 자동화
    </button>
    <button class="new-chat po-entry" id="btn-plugins" title="직무별 스킬 묶음(Anthropic Knowledge Work Plugins) 설치·관리">
      <span data-icon="blocks"></span>플러그인
    </button>
    <nav id="thread-list"></nav>
    <div class="sb-bottom">
      <button class="sb-item" id="btn-workspace">
        <span data-icon="folder"></span>
        <span class="sb-item-text"><span>작업 폴더</span><small id="ws-name">선택 안 됨</small></span>
      </button>
      <button class="sb-item" id="btn-profile"><span data-icon="user"></span><span>내 정보</span></button>
      <button class="sb-item" id="btn-memory"><span data-icon="brain"></span><span>메모리</span></button>
      <button class="sb-item" id="btn-skills"><span data-icon="puzzle"></span><span>스킬</span></button>
      <button class="sb-item" id="btn-mcp" title="커넥터(GitHub·Google·Zotero)·MCP 서버·메모리·동기화·사용량·진단"><span data-icon="plug"></span><span>연결·도구</span></button>
      <button class="sb-item" id="btn-settings"><span data-icon="gear"></span><span>설정</span></button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="btn-expand" title="사이드바 열기" data-icon="sidebar" hidden></button>
      <button class="icon-btn" id="btn-new-top" title="새 채팅" data-icon="edit" hidden></button>
      <div id="chat-title"></div>
      <label class="thread-model-picker" id="thread-model-picker" hidden>
        <span>대화 모델</span>
        <select id="thread-model" title="현재 대화에만 저장되는 모델" aria-label="현재 대화에만 저장되는 모델"></select>
      </label>
      <label class="mode-toggle" id="agent-label" title="에이전트 모드: 작업 폴더의 파일을 읽고, 고치고, 명령을 실행하며 작업합니다">
        <input type="checkbox" id="agent-toggle">
        <span class="track"><span class="thumb"></span></span>
        <span>에이전트</span>
      </label>
    </header>

    <section id="scroll">
      <div id="messages" class="column"></div>
    </section>

    <section id="po-view" hidden></section>

    <section id="tool-view" hidden></section>

    <footer id="composer-wrap">
      <div class="column">
        <div id="slash-menu" hidden></div>
        <div id="composer">
          <div id="attach-tray" hidden></div>
          <textarea id="input" rows="1" placeholder="무엇이든 물어보세요"></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <button id="btn-attach" class="icon-btn attach" title="파일 추가 (이미지·문서·텍스트)" data-icon="plus"></button>
              <input type="file" id="file-input" multiple hidden>
              <button id="ws-chip" class="chip"></button>
            </div>
            <button id="btn-send" class="send" title="보내기" disabled></button>
          </div>
        </div>
        <div class="hint">Enter 보내기 · Shift+Enter 줄바꿈 · <b>/</b> 명령어·스킬 · 파일은 끌어다 놓거나 붙여 넣기 · AI는 실수할 수 있습니다</div>
      </div>
    </footer>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast" hidden></div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="app.js"></script>
<script src="po.js"></script>
<script src="hub.js"></script>
<script src="browser.js"></script>
</body>
</html>
